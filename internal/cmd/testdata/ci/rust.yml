# Lint and tests for every language Overlord detected when it created this
# file. Overlord never rewrites it; edit freely.
name: CI

on:
  push:
    # Either default branch name; git init still defaults to master.
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
