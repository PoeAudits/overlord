# Lint and tests for every language Overlord detected when it created this
# file. Overlord never rewrites it; edit freely.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Detect package manager
        run: |
          if [ -f pnpm-lock.yaml ]; then pm=pnpm
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then pm=bun
          elif [ -f yarn.lock ]; then pm=yarn
          else pm=npm
          fi
          echo "PM=$pm" >> "$GITHUB_ENV"
      - if: env.PM == 'pnpm' || env.PM == 'yarn'
        run: corepack enable
      - if: env.PM == 'bun'
        uses: oven-sh/setup-bun@v2
      - run: $PM install
      - name: Lint
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            $PM run lint
          fi
      - name: Test
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            $PM run test
          fi

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uvx ruff check
      - run: uv run --with pytest pytest

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
